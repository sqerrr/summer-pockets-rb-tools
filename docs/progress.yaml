# Прогресс пользователя по игре и режим защиты от спойлеров.
# Читается контекст-билдером: определяет, что вообще можно показывать наружу.

goal: >-
  Перевести игру и пройти её самому, не зная сюжета заранее. Знакомство с
  историей должно произойти во время прохождения, а не во время работы над
  переводом.

user_playthrough:
  status: not_started
  scenes_played: 0
  note: >-
    Прохождения нет вообще. Любые сведения о событиях, персонажах, маршрутах и
    развязках считаются спойлером по умолчанию, а не по достижении какой-то
    границы.

spoiler_mode: strict

# Что это означает практически для агента.
rules:
  - "Не пересказывать сюжет, события и роли персонажей в видимых отчётах."
  - "Не называть, чем заканчивается сцена, маршрут или линия."
  - "Не выносить в отчёт имена, которые игрок ещё не встретил бы."
  - "Технические отчёты давать в структурных терминах: номера, объёмы, статусы."
  - >-
    Полный сценарий агент читает в закрытом режиме для карточек, глоссария и
    лора; наружу идут только безопасные выводы и сам перевод.
  - >-
    Сомнение трактуется в пользу умолчания: лучше отчёт без детали, чем
    испорченное прохождение.

current_scene: ""
played_scenes: []
approved_scenes: []
last_build: ""
last_build_profile: ""
last_build_sha256: ""
