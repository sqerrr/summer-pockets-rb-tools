status: proposed
purpose: "Абстрактный профиль русского стиля; заполнить после пилота и анализа локальных референсов."

reference_basis:
  corpus: CLANNAD ru (локально, references/local/clannad)
  lines_measured: 99315
  characters_measured: 3651845
  caveat: >-
    Референс задаёт ориентир разговорности и ритма, но не является нормой.
    Часть его решений продиктована однобайтовой кодировкой того патча,
    а не стилем, и переносить их в Summer Pockets нельзя.

register: modern-colloquial
register_evidence:
  bookish_markers_share: 0.0004
  colloquial_markers_share: 0.046
  note: "Книжные обороты в референсе практически отсутствуют."

narration:
  person: first
  density: concise
  bookishness: low
  notes:
    - "Референс: медиана повествовательной строки 38 символов, реплики 29."
    - "Медиана 5 слов в строке; строка экрана короче законченной фразы."
    - "Повествование занимает ~37% строк, реплики ~62%, внутренний монолог ~1%."
    - "Держать повествование близким к устной речи героя, без книжного синтаксиса."

dialogue:
  naturalness: high
  literal_japanese_syntax: avoid
  filler_frequency: restrained
  notes:
    - "Референс: «ну» 3.0% строк, «вот» 1.9%, «ага» 1.0%, «эм» 1.0%."
    - "Ни один филлер не превышает 4% строк - маркеры не должны бросаться в глаза."
    - "Обращение на «ты» преобладает над «вы» примерно 6:1 (13.7% против 2.1% строк)."
    - "Вопросов заметно больше восклицаний (5.2 против 2.9 знака на 1000 символов)."
    - "Эмоцию не усиливают пунктуацией: «!!» лишь в 0.46% строк, «?!» в 1.5%."

punctuation:
  ellipsis: "…"
  quotes: "«…»"
  notes:
    - "Многоточие встречается в ~29% строк референса - это ритмическая норма жанра."
    - >-
      Референс пишет многоточие тремя точками (30796 случаев) и не использует
      символ «…» ни разу. Проверено по таблице кодировки того патча: символа
      «…» в ней физически нет, то есть это вынужденное техническое решение,
      а не стилевое. SiglusEngine хранит текст в UTF-16, ограничение
      неприменимо - оставляем «…».
    - >-
      Реплики в референсе не обрамляются кавычками: говорящий вынесен в
      отдельное поле 【Имя】. Но внутри текста прямые кавычки используются
      (1.98% строк) - для цитат и речи в речи.
    - >-
      Кавычки-ёлочки «» и оба тире в кодировке референса ЕСТЬ (коды 0xA2, 0xA3,
      0xB0, 0xA5), но не использованы ни разу. Здесь это осознанный выбор
      переводчиков, а не ограничение. Мы его не наследуем: спецификация
      требует русских «…» и тире по русским правилам.
    - "Многоточий длиннее трёх точек почти нет - японские длинные ряды не копируются."

honorifics:
  policy: undecided
  notes:
    - "Референс сохраняет японские суффиксы: «-сан» 2.5% строк, «-кун» 1.3%, «-тян» 0.9%."
    - "«-сама» практически не используется (0.01%), «сэнпай» - 0.02%."
    - "«сэнсэй» сохраняется как обращение (0.17%)."
    - "Родственные обращения чаще локализованы («братик», «сестрёнка»), чем оставлены."
    - "Решение для Summer Pockets требует утверждения пользователем; см. DEC-0004."

humour:
  functional_adaptation: allowed
  notes:
    - "Реплики короткие (медиана 29 символов) - комический ритм держится на темпе."
    - "Не удлинять реплику ради шутки: длина 90-го перцентиля в референсе 65 символов."

line_length:
  reference_median: 29
  reference_p90: 65
  reference_max: 204
  notes:
    - "Ориентир, а не лимит: точные ограничения задаёт config/qa-rules.yaml после замеров."

naming:
  transcription: undecided
  notes:
    - "Референс использует смешанную систему, не чистого Поливанова."
    - "Собственное решение фиксировать в docs/glossary.yaml, а не наследовать."

approved_by_user: false
