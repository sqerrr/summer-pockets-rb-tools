status: proposed
purpose: >-
  Профиль русского стиля перевода. Выводы наполняются заново из проверенных
  фрагментов сцен, а не из построчной статистики корпуса.

reset:
  date: 2026-07-30
  reason: >-
    Прежний профиль был выведен из построчных частот русского корпуса CLANNAD.
    Такой метод описывал корпус, но не показывал, как приём собирается в сцене,
    и уже дал один ложный вывод (см. FND-0028). При сбросе референсной модели v1
    все смысловые выводы отозваны. Сам извлечённый текст корпуса остаётся
    действительным источником для чтения.
  history: docs/reference-audit.md

reference_basis:
  corpus: CLANNAD ru (локально, references/local/clannad)
  kind: style-reference-only
  caveat: >-
    Парного исходника нет: корпус показывает, как звучит русская реплика, но не
    доказывает точность перевода. Это референс стиля, а не переводческих
    решений. Статус фрагментов ограничен `usable`.

# Ориентир, а не образец для подражания. Задаёт, как текст должен звучать,
# когда формальные правила спецификации уже соблюдены. Требует утверждения.
register:
  status: proposed
  target: >-
    Современная простая русская проза от первого лица. Рассказывает не автор, а
    подросток, который думает про себя. Короткая фраза, конкретная деталь,
    отсутствие украшений.
  axes:
    literary_vs_plain: ближе к простому, но не к сленгу
    sentence_length: короткая и средняя, длинный период только как приём
    detail: конкретная и бытовая, без обобщённых описаний
    emotion: показывается через действие и ритм, не называется словом
    distance: рассказчик близко к читателю, иронизирует над собой
  aim_toward:
    - "Разговорная интонация, при которой текст остаётся письменным."
    - "Ясность: фраза понятна с первого чтения, без перечитывания."
    - "Сдержанность: сильное чувство подаётся тише, а не громче."
  avoid:
    - "Канцелярит и отглагольные существительные."
    - "Литературность XIX века: она сделает подростка книжным."
    - "Переводной синтаксис, узнаваемый как перевод."
    - "Имитация «аниме-речи» через частицы и междометия."
    - "Сленг с коротким сроком годности."
  handle: "Дневник, а не роман"
  handle_note: >-
    Короткая ручка вместо перечисления параметров. Рассказывает не автор, а
    парень про себя: он не сочиняет, а вспоминает. При споре о строке вопрос
    один - это дневник или это роман. Ручка ориентирует, но не является
    правилом: ей не проверяют и на неё не ссылаются как на запрет.

  calibration:
    method: >-
      Регистр задаётся сочетанием двух вещей: словесного описания ниже и
      длинных отрывков, которые агент читает целиком перед работой над стилем.
      Ни то, ни другое не является нормой для сверки.
    samples: references/local/clannad/style-samples/
    samples_note: >-
      Чужой перевод чужой игры. Хранится локально, в Git не идёт, в отчётах и
      переводе не цитируется. Нужен как пример звучания русской ВН-прозы, а не
      как источник формулировок.
    kinds:
      - сплошное повествование без диалога
      - длинный диалог
      - смена регистра внутри одной сцены

  # Словесное описание регистра. Наблюдения по референсному корпусу; это
  # ориентир, а не норма для сверки.
  described:
    line_vs_sentence: >-
      Экранная строка короче законченной мысли. Предложение спокойно тянется
      через две-три строки, и это нормальный вид текста, а не недосказанность.
      Числовых ориентиров длины здесь намеренно нет: они выводились построчной
      статистикой чужого корпуса и отозваны вместе с DEC-0005 и DEC-0010.
      Точные пределы задаст замер интерфейса, а не пример другой игры.
    narration: >-
      Ведётся от первого лица и звучит как мысль, а не как описание со стороны.
      Конкретная бытовая деталь вместо обобщения. Украшений нет: длинных
      сравнений, метафорических конструкций и авторских отступлений почти не
      встречается.
    emotion: >-
      Передаётся ритмом и последовательностью, а не словарём. Сильное место
      обычно короче соседних, а не длиннее. Слова, называющего чувство, чаще
      всего нет вовсе.
    silence: >-
      Строка из одних точек - полноценный такт, иногда оформленный как реплика
      с именем говорящего. Молчание бывает самым нагруженным ответом в сцене.
    humour: >-
      Держится на устройстве сцены, а не на остроте отдельной строки. Обычно
      это распределение ролей: один говорит подчёркнуто плоско и коротко, весь
      объём отдан тому, кто реагирует. Сделать реплики резонёра остроумнее -
      значит разрушить конструкцию.
    repetition: >-
      Повторяющаяся фраза повторяется дословно. Синонимизация повтора убивает
      его: читатель узнаёт формулировку, а не смысл.
    what_it_is_not: >-
      Это не книжная проза и не стилизация под разговор. Нет канцелярита, нет
      литературности XIX века, нет имитации «аниме-речи» через частицы, нет
      сленга с коротким сроком годности.
  strongest_anchor: >-
    Первая собственная сцена в статусе approved. До неё ориентир держится на
    описании выше; после неё сравнивать надо с ней.

narration:
  status: proposed
  person: first
  notes:
    - "Повествование - мысль героя, а не описание сцены со стороны."
    - "Не объяснять чувство, если оно уже показано действием или ритмом."
    - "Не добавлять знание, которого у героя ещё нет."
dialogue:
  status: proposed
  notes:
    - "Реплика короче, чем кажется правильным: экран показывает строку, а не абзац."
    - "Имя говорящего выводит движок, поэтому атрибуция в тексте не нужна."
    - "Речевую манеру держать различимой, но не демонстративной."
punctuation:
  status: pending
honorifics:
  policy: undecided
humour:
  status: pending
line_length:
  status: pending
  note: >-
    Числовые ориентиры длины не переносятся из корпуса без объяснения функции.
    Одинаково короткие реплики могут означать противоположные вещи.
naming:
  transcription: undecided
  note: "Собственное решение фиксировать в docs/glossary.yaml."

