allowed_statuses:
  - todo
  - draft
  - reviewed
  - playable
  - approved
  - lqa

allowed_flags:
  - needs_context
  - needs_source_check
  - needs_humor_review
  # Voice = written character manner; audio is outside project scope.
  - needs_voice_review
  - technical_risk
  - spoiler_sensitive

required_segment_fields:
  - id
  - source_set_id
  - source_id
  - source_hash
  - file_id
  - scene_id
  - order
  - translation
  - status

required_source_languages:
  - ja
  - en
  - zh-Hans

allowed_source_classifications:
  - translatable
  - service_nontext

protected_patterns:
  # Защитная сетка канонического текста. Бинарные поля и команды проверяет
  # активный движковый адаптер, а не эти регулярные выражения.
  - "\\{[^{}]+\\}"
  - "%[A-Za-z0-9_]+%"
  - "<[^<>]+>"
  - "\\[[^\\[\\]]+\\]"
