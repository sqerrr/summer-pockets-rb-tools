project:
  id: visual-novel-ru
  title: Visual Novel RU
  active_build: main
  source_language: ja
  source_languages: [ja, en]
  source_priority: [ja, en]
  working_source_language: en
  original_language_available: true
  target_language: ru

builds:
  main:
    id: main
    engine: unknown
    install_dir: "Game"

source_sets:
  main:
    id: SOURCE_MAIN
    build_id: main
    format: unknown
    archive: "Game/source.dat.orig"
    archive_sha256: "sha256:replace-me"
    catalog: source/parsed/main/source-records.jsonl
    source_priority: [ja, en]
    working_source_language: en
    build_slot: 1
    slots:
      - {index: 0, language: ja, role: original}
      - {index: 1, language: en, role: official_translation}

paths:
  source_manifest: source/manifest.jsonl
  segments: translation/segments
  scenes: translation/scenes.jsonl
  glossary: docs/glossary.yaml
  decisions: docs/decisions.jsonl
  summaries: docs/scene-summaries.jsonl
  characters: docs/characters
  private_constraints: private/constraints.jsonl
  reference_corpora: references/local
  database: database/knowledge.db

integration:
  # Заполнить после аудита существующего инструментария.
  parse_command: ""
  build_command: ""
  smoke_test_command: ""

workflow:
  context_previous_segments: 20
  context_next_segments: 10
  internal_examples_limit: 20
  external_reference_limit: 3
  max_scene_segments: 500
  user_progress_scene: ""
